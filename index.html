    <style>
        /* --- 基础样式 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: white; font-family: "Microsoft YaHei", sans-serif; padding: 20px; }
        .tree { 
            background: transparent; 
            box-shadow: none; 
            max-width: 3000px; 
            position: relative;
        }
        
        ul { 
            list-style: none; 
            position: relative;
        }
        
        li { 
            margin: 5px 0; 
            position: relative;
            padding-left: 20px;
        }
        
        /* 文件夹展开时的连接线 */
        li.active > ul::before {
            content: '';
            position: absolute;
            left: 8px; /* 图标中心位置 */
            top: 0;
            bottom: 0;
            width: 1px;
            background-color: #ddd;
            z-index: 0;
        }
        
        /* 每个子项前面的连接线点 - PC端基础样式 */
        li li::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 12px; /* 垂直居中 */
            width: 8px;
            height: 1px;
            background-color: #ddd;
            z-index: 0;
        }
        
        .tree-item { 
            display: flex; 
            align-items: center;
            position: relative;
            z-index: 1; /* 确保内容在线上方 */
        }
        
        /* 链接样式 */
        .tree a { 
            color: #333; 
            text-decoration: none; 
            display: inline-block; 
            padding: 5px; 
            border-radius: 3px; 
            transition: all 0.2s; 
            margin-left: 5px; 
            cursor: pointer;
            position: relative;
        }
        
        .tree a:hover { 
            background: #e3f2fd; 
            color: #2196F3; 
        }
        
        /* 图标容器样式 */
        .item-icon {
            display: inline-flex;
			align-items: center;
			justify-content: center;
            width: 16px;
            height: 16px;
            margin-right: 8px;
			flex-shrink: 0;
            position: relative;
            z-index: 1;
            cursor: pointer; /* 文件夹图标可点击 */
        }
        
        .favicon {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 2px;
            background: #f5f5f5;
            padding: 1px;
        }
        
        /* 文件夹图标样式 - 黄色文件夹 */
        .folder-icon {
            font-size: 16px;
            cursor: pointer;
			line-height: 1;
            color: #ffa726; /* 黄色 */
            display: flex;
			align-items: center;
			justify-content: center;
			width: 100%;
			height: 100%;
        }
        
        /* 文件图标样式 */
        .file-icon {
            font-size: 14px;
            text-align: center;
            color: #78909c; /* 灰色 */
			line-height: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			width: 100%;
			height: 100%;
        }
        
        /* 纯文本/分割线样式 */
        .label-text { 
            color: #888; 
            padding: 5px; 
            margin-left: 5px; 
            font-size: 0.9em;
            position: relative;
        }
        
        /* 纯文本项不需要图标 */
        .tree-item:has(.label-text) .item-icon {
            display: none;
        }

        /* 状态控制 */
        .submenu { 
            display: none; 
            position: relative;
        }
        
        .active > .submenu { 
            display: block; 
        }
        
        /* 最外层容器去除左侧padding */
        #tree-root > ul {
            padding-left: 0;
        }
		
		/* 右上角科技面板（基础样式，显隐完全由JS控制，无CSS强制隐藏） */

			position: fixed;
			top: 16px;
			right: 16px;

			background: linear-gradient(135deg, #f0f4f8 0%, #f5f0f8 100%);

		.tech-panel:hover {

		.panel-title {

		.toggle-panel {

		.contact-item {

		.contact-icon {
			width: 16px;

			background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
			border-radius: 4.8px;
			display: flex;
			align-items: center;
			justify-content: center;
			color: white;

			flex-shrink: 0;
		}

		.contact-info {
			flex: 1;
		}

		.contact-name {

			background: rgba(255, 255, 255, 0.5);
			border-radius: 10.67px;
			margin-bottom: 6.4px;
			transition: all 0.2s;
			border: 1px solid transparent;
		}

		.line-item:hover {
			background: rgba(255, 255, 255, 0.8);
			border-color: rgba(156, 39, 176, 0.2);
		}

		.line-status {

			height: 8px;

		}

        /* ============= 控制按钮样式（PC端样式，移动端保持一致） ============= */
        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
            padding: 8px;
        }
        
        .expand-btn {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 250;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(33, 150, 243, 0.3);
            
            /* 高斯模糊效果 */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            
            /* 玻璃拟态边框 */
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .expand-btn:hover {
            background: linear-gradient(135deg, #1976D2 0%, #0D47A1 100%);
            box-shadow: 0 6px 24px rgba(33, 150, 243, 0.4);
            transform: translateY(-2px);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        
        .expand-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(33, 150, 243, 0.2);
        }
        
        /* ============= 移动端专属优化（仅紧凑布局，无放大，按钮保持PC尺寸） ============= */

            /* 1. 整体重置：彻底消除留白，紧凑布局 */
            body {
                padding: 5px 3px !important;
                margin: 0 !important;
                max-width: 100vw;
                overflow-x: hidden;
                box-sizing: border-box;
            }
            
            /* 2. 树状目录：减少缩进和间距，紧凑显示 */
            .tree {
                padding-left: 0 !important;
                border-left: none;
                margin: 0 !important;
                width: 100%;
            }
            
            /* 3. 列表相关：减少内外边距，消除冗余空白 */
            ul {
                padding-left: 12px !important;
                margin: 0 !important;
            }
            
            li {
                padding-left: 15px !important;
                margin: 3px 0 !important; /* 减少垂直间距，更紧凑 */
            }
            
            /* 4. 内容元素：缩小间距，紧凑排版 */
            .tree a {
                margin-left: 2px !important;
                padding: 4px 3px !important;
                font-size: 14px !important; /* 保持原有字体大小 */
            }
            
            .item-icon {
                width: 16px !important; /* 保持原有图标大小 */
                height: 16px !important;
                margin-right: 6px !important; /* 减少图标与文字间距 */
            }
            
            .folder-icon, 
            .file-icon {
                font-size: 16px !important; /* 保持原有图标字体大小 */
            }
            
            .label-text {
                color: #888;
                padding: 4px !important;
                margin-left: 2px !important;
                font-size: 0.9em !important; /* 保持原有字体大小 */
            }
            
            /* 5. 控制按钮区域：仅调整间距，按钮保持PC端尺寸 */
            .controls {
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 8px 0 !important; /* 保持与PC端接近的间距 */
                margin: 0 0 10px 0 !important;
                width: 100%;
            }
            
            /* 展开折叠按钮：完全继承PC端样式，不做放大修改 */
            .expand-btn {
                padding: 8px 24px !important;
                font-size: 12px !important;
                border-radius: 15px !important;
                min-width: auto !important;
                text-align: center;
            }
            
            /* 6. 科技面板与切换按钮：仅调整位置，不显隐控制 */
            .tech-panel {
                top: 5px !important;
                right: 5px !important;
                max-width: 85vw;
            }
            
            .toggle-panel {
                top: 5px !important;
                right: 5px !important;
                background: rgba(255, 255, 255, 0.9);
                border: 1px solid rgba(0, 0, 0, 0.15);
            }
            
            /* 7. 面板内部元素：保持原有尺寸，紧凑排版 */
            .panel-title {
                font-size: 12.8px !important; /* 保持原有字体大小 */
            }
            
            .contact-name,
            .line-name {
                font-size: 10.4px !important; /* 保持原有字体大小 */
            }
            
            .contact-detail,
            .line-desc {
                font-size: 9.6px !important; /* 保持原有字体大小 */
            }
            
            /* 8. 触摸优化：确保点击区域有效 */
            .tree-item {
                min-height: 32px; /* 合理设置触摸区域 */
                align-items: center; /* 确保垂直居中，辅助连接线对齐 */
            }
            
            .tree a,
            .folder-icon,
            .expand-btn,
            .toggle-panel {
                -webkit-tap-highlight-color: rgba(33, 150, 243, 0.2);
                tap-highlight-color: rgba(33, 150, 243, 0.2);
            }
            
            /* 9. 横向滚动优化：消除溢出，紧凑显示 */
            #tree-root {
                width: 100%;
                overflow-x: hidden;
                margin-top: 5px;
                padding-bottom: 20px;
            }
            
            /* 10. 连接线优化：适配移动端紧凑布局，修复显示问题 */

            li.active > ul::before {

                height: 1px !important;
                background-color: #ddd !important;
                z-index: 0 !important;
            }

        /* 超小屏幕进一步优化（仅紧凑，不放大，按钮保持PC尺寸） */
        @media (max-width: 480px) {
            .tree a {

            }

            li.active > ul::before {

            }
            
            li li::before {
                left: 5px !important;
                top: 10px !important;
                width: 5px !important;
            }
        }
		
    </style>

        // ==========================================
        // 2. 核心逻辑 - 修改版（移除箭头，使用文件夹图标控制）
        // ==========================================
        
        function createTree(nodes) {
            if (!nodes || nodes.length === 0) return null;

            const ul = document.createElement('ul');
            ul.className = 'submenu';

            nodes.forEach(node => {
                const li = document.createElement('li');
                const itemDiv = document.createElement('div');
                itemDiv.className = 'tree-item';

                // 判断是否为文件夹
                const isFolder = node.children && Array.isArray(node.children);

                // 创建图标容器
                const iconSpan = document.createElement('span');
                iconSpan.className = 'item-icon';
                
                // 创建链接或文本
                if (node.url) {
                    // 添加 favicon
                    addFavicon(iconSpan, node.url, isFolder);
                    
                    const a = document.createElement('a');
                    a.href = node.url;
                    a.target = "_blank";
                    a.textContent = node.name;
                    a.className = isFolder ? 'folder' : 'file';
                    
                    itemDiv.appendChild(iconSpan);
                    itemDiv.appendChild(a);
                    
                    // 如果是文件夹，图标可点击折叠/展开
                    if (isFolder) {
                        iconSpan.onclick = function(e) {
                            e.stopPropagation();
                            li.classList.toggle('active');
                            updateButtonState();
                        };
                        // 点击文件夹文字也能折叠
                        a.onclick = function(e) {
                            e.preventDefault();
                            li.classList.toggle('active');
                            updateButtonState();
                        };
                    }
                } else if (isFolder) {
                    // 文件夹使用黄色文件夹图标
                    const folderIcon = document.createElement('span');
                    folderIcon.className = 'folder-icon';
                    folderIcon.textContent = '📁';
                    folderIcon.title = '点击展开/折叠';
                    
                    // 文件夹图标可点击折叠/展开
                    folderIcon.onclick = function(e) {
                        e.stopPropagation();
                        li.classList.toggle('active');
                        updateButtonState();
                    };
                    
                    iconSpan.appendChild(folderIcon);
                    
                    const a = document.createElement('a');
                    a.href = "javascript:void(0);";
                    a.textContent = node.name;
                    a.className = 'folder';
                    
                    // 点击文件夹文字也能折叠
                    a.onclick = function(e) {
                        e.preventDefault();
                        li.classList.toggle('active');
                        updateButtonState();
                    };
                    
                    itemDiv.appendChild(iconSpan);
                    itemDiv.appendChild(a);
                } else {
                    // 纯文本/分割线
                    iconSpan.remove();
                    const span = document.createElement('span');
                    span.textContent = node.name;
                    span.className = 'label-text';
                    // 为了对齐，添加一个占位符
                    const placeholder = document.createElement('span');
                    placeholder.style.width = '16px';
                    placeholder.style.display = 'inline-block';
                    placeholder.style.flexShrink = '0';
                    itemDiv.appendChild(placeholder);
                    itemDiv.appendChild(span);
                }

                li.appendChild(itemDiv);

                // 递归生成子树
                if (isFolder) {
                    const childUl = createTree(node.children);
                    if (childUl) {
                        li.appendChild(childUl);
                    }
                }

                ul.appendChild(li);
            });

            return ul;
        }

        // ==========================================
        // 3. Favicon 相关函数
        // ==========================================
        
        function getFaviconUrl(url) {
            try {
                const urlObj = new URL(url);
                return `https://www.google.com/s2/favicons?sz=32&domain=${urlObj.hostname}`;
            } catch (e) {
                console.warn('解析URL失败:', url, e);
                return null;
            }
        }

        function addFavicon(container, url, isFolder) {
            if (isFolder) {
                // 文件夹使用黄色文件夹图标
                const folderIcon = document.createElement('span');
                folderIcon.className = 'folder-icon';
                folderIcon.textContent = '📁';
                folderIcon.title = '点击展开/折叠';
                container.appendChild(folderIcon);
                return;
            }
            
            const faviconUrl = getFaviconUrl(url);
            
            if (faviconUrl) {
                const img = document.createElement('img');
                img.src = faviconUrl;
                img.alt = '';
                img.className = 'favicon';
                
                img.onload = function() {
                    container.appendChild(img);
                };
                
                img.onerror = function() {
                    // 失败时显示文件图标
                    const fileIcon = document.createElement('span');
                    fileIcon.className = 'file-icon';
                    fileIcon.textContent = '📄';
                    container.appendChild(fileIcon);
                };
                
                setTimeout(() => {
                    if (!img.complete && container.children.length === 0) {
                        const fileIcon = document.createElement('span');
                        fileIcon.className = 'file-icon';
                        fileIcon.textContent = '📄';
                        container.appendChild(fileIcon);
                    }
                }, 3000);
            } else {
                // 无法获取时显示文件图标
                const fileIcon = document.createElement('span');
                fileIcon.className = 'file-icon';
                fileIcon.textContent = '📄';
                container.appendChild(fileIcon);
            }
        }

        // ==========================================
        // 4. 展开/折叠功能
        // ==========================================
        let isAllExpanded = false;
        
        function toggleAllFolders() {
            const allFolders = document.querySelectorAll('.tree li:has(.folder)');
            
            if (!isAllExpanded) {
                allFolders.forEach(folder => {
                    folder.classList.add('active');
                });
                isAllExpanded = true;
                expandBtn.textContent = '折叠';
            } else {
                allFolders.forEach(folder => {
                    folder.classList.remove('active');
                });
                isAllExpanded = false;
                expandBtn.textContent = '展开';
            }
        }
        
        function updateButtonState() {
            const allFolders = document.querySelectorAll('.tree li:has(.folder)');
            const activeFolders = document.querySelectorAll('.tree li.active:has(.folder)');
            
            if (allFolders.length === activeFolders.length && allFolders.length > 0) {
                isAllExpanded = true;
                expandBtn.textContent = '折叠';
            } else {
                isAllExpanded = false;
                expandBtn.textContent = '展开';
            }
        }

        // ==========
        // 5. 初始化
        // ==========
        
        const rootContainer = document.getElementById('tree-root');
        const treeDom = createTree(treeData);
        if (treeDom) {
            treeDom.style.display = 'block'; 
            treeDom.style.paddingLeft = '0';
            rootContainer.appendChild(treeDom);
        }

        const expandBtn = document.getElementById('expand-all-btn');
        expandBtn.addEventListener('click', toggleAllFolders);
        
        setTimeout(updateButtonState, 100);
		
		// =================
		// 6. 科技面板功能（全局默认隐藏，点击切换正常生效）
		// =================
		function initTechPanel() {
			const panel = document.getElementById('tech-panel');
			const toggleBtn = document.getElementById('toggle-panel');
			
			// 初始状态：面板隐藏，按钮显示“＋”（已在HTML和CSS中设置，无需额外修改）
			
			// 切换面板显示/隐藏（全局统一逻辑，不分设备）
			toggleBtn.addEventListener('click', function() {
				if (toggleBtn.textContent === '＋') {
					// 显示面板
					panel.style.opacity = '1';
					panel.style.pointerEvents = 'auto';
					// 适配移动端样式
					if (window.innerWidth <= 768) {
						panel.style.background = 'linear-gradient(135deg, rgba(240, 244, 248, 0.95) 0%, rgba(245, 240, 248, 0.95) 100%)';
						panel.style.boxShadow = '0 5px 20px rgba(0, 0, 0, 0.15)';
					}
					toggleBtn.textContent = '－';
				} else {
					// 隐藏面板
					panel.style.opacity = '0';
					panel.style.pointerEvents = 'none';
					// 适配移动端样式
					if (window.innerWidth <= 768) {
						panel.style.background = 'transparent';
						panel.style.boxShadow = 'none';
					}
					toggleBtn.textContent = '＋';
				}
			});
			
			// 移动端：点击面板外区域关闭
			document.addEventListener('click', function(event) {
				if (window.innerWidth <= 768 && 
					!panel.contains(event.target) && 
					toggleBtn.textContent === '－' && 
					event.target !== toggleBtn) {
					
					// 触发点击事件，隐藏面板
					toggleBtn.click();
				}
			});
			
			// 线路状态闪烁效果
			function updateLineStatus() {
				const lines = document.querySelectorAll('.line-item');
				lines.forEach(line => {
					const statusDot = line.querySelector('.line-status');
					if (statusDot.classList.contains('online')) {
						// 初始化透明度
						statusDot.style.opacity = '1';
						
						setInterval(() => {
							statusDot.style.opacity = 
								statusDot.style.opacity === '0.7' ? '1' : '0.7';
						}, 2000);
					}
				});
			}
			
			updateLineStatus();
		}

		// 初始化科技面板
		setTimeout(initTechPanel, 100);
    </script>
