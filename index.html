<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>可配置树状导航</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* --- 基础样式 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: white; font-family: "Microsoft YaHei", sans-serif; padding: 20px; }
        .tree { 
            background: transparent; 
            box-shadow: none; 
            max-width: 3000px; 
            position: relative;
        }
        
        ul { 
            list-style: none; 
            position: relative;
        }
        
        li { 
            margin: 5px 0; 
            position: relative;
            padding-left: 20px;
        }
        
        /* 文件夹展开时的连接线 */
        li.active > ul::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 0;
            bottom: 0;
            width: 1px;
            background-color: #ddd;
            z-index: 0;
        }
        
        /* 每个子项前面的连接线点 - PC端基础样式 */
        li li::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 12px;
            width: 8px;
            height: 1px;
            background-color: #ddd;
            z-index: 0;
        }
        
        .tree-item { 
            display: flex; 
            align-items: center;
            position: relative;
            z-index: 1;
        }
        
        /* 链接样式 */
        .tree a { 
            color: #333; 
            text-decoration: none; 
            display: inline-block; 
            padding: 5px; 
            border-radius: 3px; 
            transition: all 0.2s; 
            margin-left: 5px; 
            cursor: pointer;
            position: relative;
        }
        
        .tree a:hover { 
            background: #e3f2fd; 
            color: #2196F3; 
        }
        
        /* 图标容器样式 */
        .item-icon {
            display: inline-flex;
			align-items: center;
			justify-content: center;
            width: 16px;
            height: 16px;
            margin-right: 8px;
			flex-shrink: 0;
            position: relative;
            z-index: 1;
            cursor: pointer;
        }
        
        .favicon {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 2px;
            background: #f5f5f5;
            padding: 1px;
        }
        
        /* 文件夹图标样式 - 黄色文件夹 */
        .folder-icon {
            font-size: 16px;
            cursor: pointer;
			line-height: 1;
            color: #ffa726;
            display: flex;
			align-items: center;
			justify-content: center;
			width: 100%;
			height: 100%;
        }
        
        /* 文件图标样式 */
        .file-icon {
            font-size: 14px;
            text-align: center;
            color: #78909c;
			line-height: 1;
			display: flex;
			align-items: center;
			justify-content: center;
			width: 100%;
			height: 100%;
        }
        
        /* 纯文本/分割线样式 */
        .label-text { 
            color: #888; 
            padding: 5px; 
            margin-left: 5px; 
            font-size: 0.9em;
            position: relative;
        }
        
        /* 纯文本项不需要图标 */
        .tree-item:has(.label-text) .item-icon {
            display: none;
        }
        /* 状态控制 */
        .submenu { 
            display: none; 
            position: relative;
        }
        
        .active > .submenu { 
            display: block; 
        }
        
        /* 最外层容器去除左侧padding */
        #tree-root > ul {
            padding-left: 0;
        }
		
		/* 右上角科技面板 */
		.tech-panel {
			position: fixed;
			top: 16px;
			right: 16px;
			width: 224px;
			background: linear-gradient(135deg, #f0f4f8 0%, #f5f0f8 100%);
			border-radius: 12.8px;
			padding: 16px;
			box-shadow: 
				0 10px 30px rgba(0, 0, 0, 0.08),
				inset 0 1px 0 rgba(255, 255, 255, 0.6),
				0 0 0 1px rgba(255, 255, 255, 0.8);
			backdrop-filter: blur(20px);
			-webkit-backdrop-filter: blur(20px);
			z-index: 1000;
			border: 1px solid rgba(255, 255, 255, 0.4);
			transition: opacity 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
			opacity: 0;
			pointer-events: none;
		}
		.tech-panel:hover {
			transform: translateY(-2px);
			box-shadow: 
				0 15px 40px rgba(0, 0, 0, 0.12),
				inset 0 1px 0 rgba(255, 255, 255, 0.7);
		}
		.panel-header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			margin-bottom: 16px;
			padding-bottom: 9.6px;
			border-bottom: 1px solid rgba(0, 0, 0, 0.08);
		}
		.panel-title {
			font-size: 12.8px;
			font-weight: 600;
			color: #333;
			display: flex;
			align-items: center;
			gap: 10.67px;
		}
		.panel-title::before {
			content: '🔗';
			font-size: 11.2px;
		}
		.toggle-panel {
			position: fixed;
			top: 16px;
			right: 16px;
			z-index: 1001;
			background: rgba(255, 255, 255, 0.7);
			border: 1px solid rgba(0, 0, 0, 0.1);
			border-radius: 10.67px;
			width: 22.4px;
			height: 22.4px;
			display: flex;
			align-items: center;
			justify-content: center;
			cursor: pointer;
			font-size: 9.6px;
			color: #666;
			transition: all 0.2s;
		}
		.toggle-panel:hover {
			background: rgba(255, 255, 255, 0.9);
			color: #2196F3;
		}
		.contact-section {
			margin-bottom: 16px;
		}
		.section-title {
			font-size: 10.4px;
			font-weight: 500;
			color: #666;
			margin-bottom: 8px;
			text-transform: uppercase;
			letter-spacing: 0.4px;
			display: flex;
			align-items: center;
			gap: 8px;
		}
		.section-title::before {
			content: '📧';
			font-size: 9.6px;
		}
		.contact-item {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 6.4px 9.6px;
			background: rgba(255, 255, 255, 0.5);
			border-radius: 10.67px;
			margin-bottom: 6.4px;
			transition: all 0.2s;
			border: 1px solid transparent;
		}
		.contact-item:hover {
			background: rgba(255, 255, 255, 0.8);
			border-color: rgba(33, 150, 243, 0.2);
			transform: translateX(2px);
		}
		.contact-icon {
			width: 16px;
			height: 16px;
			background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
			border-radius: 4.8px;
			display: flex;
			align-items: center;
			justify-content: center;
			color: white;
			font-size: 8px;
			flex-shrink: 0;
		}
		.contact-info {
			flex: 1;
		}
		.contact-name {
			font-size: 10.4px;
			color: #444;
			margin-bottom: 2.67px;
		}
		.contact-detail {
			font-size: 9.6px;
			color: #666;
		}
		.lines-section {
			margin-top: 20px;
		}
		.lines-section .section-title::before {
			content: '🌐';
		}
		.line-item {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 6.4px 9.6px;
			background: rgba(255, 255, 255, 0.5);
			border-radius: 10.67px;
			margin-bottom: 6.4px;
			transition: all 0.2s;
			border: 1px solid transparent;
		}
		.line-item:hover {
			background: rgba(255, 255, 255, 0.8);
			border-color: rgba(156, 39, 176, 0.2);
		}
		.line-status {
			width: 8px;
			height: 8px;
			border-radius: 50%;
			flex-shrink: 0;
		}
		.line-status.online {
			background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
			box-shadow: 0 0 8px rgba(76, 175, 80, 0.3);
		}
		.line-status.offline {
			background: linear-gradient(135deg, #f44336 0%, #d32f2f 100%);
		}
		.line-status.maintenance {
			background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%);
		}
		.line-info {
			flex: 1;
		}
		.line-name {
			font-size: 10.4px;
			color: #444;
			margin-bottom: 2.67px;
		}
		.line-desc {
			font-size: 8.8px;
			color: #888;
		}
		.line-speed {
			font-size: 8.8px;
			font-weight: 500;
			padding: 2.67px 8px;
			background: rgba(255, 255, 255, 0.7);
			border-radius: 5.33px;
			border: 1px solid rgba(0, 0, 0, 0.1);
		}
        
        /* 控制按钮样式 */
        .controls {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
            padding: 8px;
        }
        
        .expand-btn {
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            color: white;
            border: none;
            padding: 8px 24px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 250;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(33, 150, 243, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .expand-btn:hover {
            background: linear-gradient(135deg, #1976D2 0%, #0D47A1 100%);
            box-shadow: 0 6px 24px rgba(33, 150, 243, 0.4);
            transform: translateY(-2px);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        
        .expand-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(33, 150, 243, 0.2);
        }
        
        /* 移动端专属优化 */
        @media (max-width: 768px) {
            body {
                padding: 5px 3px !important;
                margin: 0 !important;
                max-width: 100vw;
                overflow-x: hidden;
                box-sizing: border-box;
            }
            
            .tree {
                padding-left: 0 !important;
                border-left: none;
                margin: 0 !important;
                width: 100%;
            }
            
            ul {
                padding-left: 12px !important;
                margin: 0 !important;
            }
            
            li {
                padding-left: 15px !important;
                margin: 3px 0 !important;
            }
            
            .tree a {
                margin-left: 2px !important;
                padding: 4px 3px !important;
                font-size: 14px !important;
            }
            
            .item-icon {
                width: 16px !important;
                height: 16px !important;
                margin-right: 6px !important;
            }
            
            .folder-icon, 
            .file-icon {
                font-size: 16px !important;
            }
            
            .label-text {
                padding: 4px !important;
                margin-left: 2px !important;
                font-size: 0.9em !important;
            }
            
            .controls {
                padding: 8px 0 !important;
                margin: 0 0 10px 0 !important;
                width: 100%;
            }
            
            .expand-btn {
                padding: 8px 24px !important;
                font-size: 12px !important;
                border-radius: 15px !important;
            }
            
            .tech-panel {
                top: 5px !important;
                right: 5px !important;
                max-width: 85vw;
            }
            
            .toggle-panel {
                top: 5px !important;
                right: 5px !important;
                background: rgba(255, 255, 255, 0.9);
                border: 1px solid rgba(0, 0, 0, 0.15);
            }
            
            .panel-title {
                font-size: 12.8px !important;
            }
            
            .contact-name, .line-name {
                font-size: 10.4px !important;
            }
            
            .contact-detail, .line-desc {
                font-size: 9.6px !important;
            }
            
            .tree-item {
                min-height: 32px;
                align-items: center;
            }
            
            .tree a, .folder-icon, .expand-btn, .toggle-panel {
                -webkit-tap-highlight-color: rgba(33, 150, 243, 0.2);
                tap-highlight-color: rgba(33, 150, 243, 0.2);
            }
            
            #tree-root {
                width: 100%;
                overflow-x: hidden;
                margin-top: 5px;
                padding-bottom: 20px;
            }
            
            li.active > ul::before {
                left: 6px !important;
                width: 1px !important;
                background-color: #ddd !important;
            }
            
            li li::before {
                left: 6px !important;
                top: 11px !important;
                width: 6px !important;
                height: 1px !important;
                background-color: #ddd !important;
                z-index: 0 !important;
            }
        }
        
        @media (max-width: 480px) {
            .tree a {
                font-size: 13px !important;
                padding: 3px 2px !important;
            }
            
            .item-icon {
                width: 15px !important;
                height: 15px !important;
                margin-right: 5px !important;
            }
            
            .expand-btn {
                padding: 8px 24px !important;
                font-size: 12px !important;
            }
            
            .tech-panel {
                width: 200px !important;
                padding: 14px !important;
            }
            
            ul {
                padding-left: 10px !important;
            }
            
            li {
                padding-left: 12px !important;
            }
            
            li.active > ul::before {
                left: 5px !important;
            }
            
            li li::before {
                left: 5px !important;
                top: 10px !important;
                width: 5px !important;
            }
        }
    </style>
</head>
<body>
    <button class="toggle-panel" id="toggle-panel">＋</button>
    <div class="tech-panel" id="tech-panel">
        <div class="panel-header">
            <div class="panel-title">控制面板</div>
        </div>
        <div class="contact-section">
            <div class="section-title">联系方式</div>
            <div class="contact-item">
                <div class="contact-icon">邮</div>
                <div class="contact-info">
                    <div class="contact-name">邮箱</div>
                    <div class="contact-detail">admin@example.com</div>
                </div>
            </div>
            <div class="contact-item">
                <div class="contact-icon">电</div>
                <div class="contact-info">
                    <div class="contact-name">Telegram</div>
                    <div class="contact-detail">@username</div>
                </div>
            </div>
            <div class="contact-item">
                <div class="contact-icon">Q</div>
                <div class="contact-info">
                    <div class="contact-name">QQ群</div>
                    <div class="contact-detail">123456789</div>
                </div>
            </div>
        </div>
        <div class="lines-section">
            <div class="section-title">线路状态</div>
            <div class="line-item">
                <div class="line-status online"></div>
                <div class="line-info">
                    <div class="line-name">主线路 - 香港CN2</div>
                    <div class="line-desc">低延迟，稳定推荐</div>
                </div>
                <div class="line-speed">50ms</div>
            </div>
            <div class="line-item">
                <div class="line-status online"></div>
                <div class="line-info">
                    <div class="line-name">备用线路 - 日本软银</div>
                    <div class="line-desc">高速下载线路</div>
                </div>
                <div class="line-speed">80ms</div>
            </div>
            <div class="line-item">
                <div class="line-status maintenance"></div>
                <div class="line-info">
                    <div class="line-name">备用线路 - 美国</div>
                    <div class="line-desc">国际线路，维护中</div>
                </div>
                <div class="line-speed">180ms</div>
            </div>
            <div class="line-item">
                <div class="line-status offline"></div>
                <div class="line-info">
                    <div class="line-name">测试线路 - 新加坡</div>
                    <div class="line-desc">暂时不可用</div>
                </div>
                <div class="line-speed">-</div>
            </div>
        </div>
    </div>
    
    <div class="controls">
        <button id="expand-all-btn" class="expand-btn">展开</button>
    </div>
    <div id="tree-root" class="tree"></div>

    <script>
        // 从外部tree.json加载导航数据
        let treeData = [];
        async function loadTreeData() {
            try {
                const response = await fetch('./tree.json');
                if (!response.ok) throw new Error('导航数据加载失败');
                treeData = await response.json();
                renderTree();
            } catch (error) {
                console.error('数据加载异常：', error);
                treeData = [{ name: "数据加载失败", url: "#" }];
                renderTree();
            }
        }

        // 树状导航生成函数
        function createTree(nodes) {
            if (!nodes || nodes.length === 0) return null;
            const ul = document.createElement('ul');
            ul.className = 'submenu';
            nodes.forEach(node => {
                const li = document.createElement('li');
                const itemDiv = document.createElement('div');
                itemDiv.className = 'tree-item';
                const isFolder = node.children && Array.isArray(node.children);
                const iconSpan = document.createElement('span');
                iconSpan.className = 'item-icon';

                if (node.url) {
                    addFavicon(iconSpan, node.url, isFolder);
                    const a = document.createElement('a');
                    a.href = node.url;
                    a.target = "_blank";
                    a.textContent = node.name;
                    a.className = isFolder ? 'folder' : 'file';
                    itemDiv.appendChild(iconSpan);
                    itemDiv.appendChild(a);

                    if (isFolder) {
                        iconSpan.onclick = function(e) {
                            e.stopPropagation();
                            li.classList.toggle('active');
                            updateButtonState();
                        };
                        a.onclick = function(e) {
                            e.preventDefault();
                            li.classList.toggle('active');
                            updateButtonState();
                        };
                    }
                } else if (isFolder) {
                    const folderIcon = document.createElement('span');
                    folderIcon.className = 'folder-icon';
                    folderIcon.textContent = '📁';
                    folderIcon.title = '点击展开/折叠';
                    folderIcon.onclick = function(e) {
                        e.stopPropagation();
                        li.classList.toggle('active');
                        updateButtonState();
                    };
                    iconSpan.appendChild(folderIcon);
                    const a = document.createElement('a');
                    a.href = "javascript:void(0);";
                    a.textContent = node.name;
                    a.className = 'folder';
                    a.onclick = function(e) {
                        e.preventDefault();
                        li.classList.toggle('active');
                        updateButtonState();
                    };
                    itemDiv.appendChild(iconSpan);
                    itemDiv.appendChild(a);
                } else {
                    iconSpan.remove();
                    const span = document.createElement('span');
                    span.textContent = node.name;
                    span.className = 'label-text';
                    const placeholder = document.createElement('span');
                    placeholder.style.width = '16px';
                    placeholder.style.display = 'inline-block';
                    placeholder.style.flexShrink = '0';
                    itemDiv.appendChild(placeholder);
                    itemDiv.appendChild(span);
                }
                li.appendChild(itemDiv);
                if (isFolder) {
                    const childUl = createTree(node.children);
                    if (childUl) li.appendChild(childUl);
                }
                ul.appendChild(li);
            });
            return ul;
        }

        // Favicon加载函数
        function getFaviconUrl(url) {
            try {
                const urlObj = new URL(url);
                return `https://www.google.com/s2/favicons?sz=32&domain=${urlObj.hostname}`;
            } catch (e) {
                return null;
            }
        }
        function addFavicon(container, url, isFolder) {
            if (isFolder) {
                const folderIcon = document.createElement('span');
                folderIcon.className = 'folder-icon';
                folderIcon.textContent = '📁';
                container.appendChild(folderIcon);
                return;
            }
            const faviconUrl = getFaviconUrl(url);
            if (faviconUrl) {
                const img = document.createElement('img');
                img.src = faviconUrl;
                img.alt = '';
                img.className = 'favicon';
                img.onload = () => container.appendChild(img);
                img.onerror = () => {
                    const fi = document.createElement('span');
                    fi.className = 'file-icon';
                    fi.textContent = '📄';
                    container.appendChild(fi);
                };
                setTimeout(() => {
                    if (!img.complete && container.children.length === 0) {
                        const fi = document.createElement('span');
                        fi.className = 'file-icon';
                        fi.textContent = '📄';
                        container.appendChild(fi);
                    }
                }, 3000);
            } else {
                const fi = document.createElement('span');
                fi.className = 'file-icon';
                fi.textContent = '📄';
                container.appendChild(fi);
            }
        }

        // 展开/折叠控制
        let isAllExpanded = false;
        function toggleAllFolders() {
            const allFolders = document.querySelectorAll('.tree li:has(.folder)');
            if (!isAllExpanded) {
                allFolders.forEach(f => f.classList.add('active'));
                isAllExpanded = true;
                expandBtn.textContent = '折叠';
            } else {
                allFolders.forEach(f => f.classList.remove('active'));
                isAllExpanded = false;
                expandBtn.textContent = '展开';
            }
        }
        function updateButtonState() {
            const all = document.querySelectorAll('.tree li:has(.folder)');
            const active = document.querySelectorAll('.tree li.active:has(.folder)');
            isAllExpanded = all.length === active.length && all.length > 0;
            expandBtn.textContent = isAllExpanded ? '折叠' : '展开';
        }

        // 渲染导航
        function renderTree() {
            const root = document.getElementById('tree-root');
            root.innerHTML = '';
            const treeDom = createTree(treeData);
            if (treeDom) {
                treeDom.style.display = 'block';
                treeDom.style.paddingLeft = '0';
                root.appendChild(treeDom);
            }
            setTimeout(updateButtonState, 100);
        }

        // 科技面板
        function initTechPanel() {
            const panel = document.getElementById('tech-panel');
            const toggleBtn = document.getElementById('toggle-panel');
            toggleBtn.addEventListener('click', () => {
                if (toggleBtn.textContent === '＋') {
                    panel.style.opacity = '1';
                    panel.style.pointerEvents = 'auto';
                    toggleBtn.textContent = '－';
                } else {
                    panel.style.opacity = '0';
                    panel.style.pointerEvents = 'none';
                    toggleBtn.textContent = '＋';
                }
            });
            document.addEventListener('click', e => {
                if (window.innerWidth <= 768 && !panel.contains(e.target) && toggleBtn.textContent === '－' && e.target !== toggleBtn) {
                    toggleBtn.click();
                }
            });
            document.querySelectorAll('.line-status.online').forEach(dot => {
                setInterval(() => dot.style.opacity = dot.style.opacity === '0.7' ? '1' : '0.7', 2000);
            });
        }

        // 初始化
        const expandBtn = document.getElementById('expand-all-btn');
